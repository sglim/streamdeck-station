<!DOCTYPE html>
<html>
<head lang="en">
  <title>iTerm Navigate Settings</title>
  <meta charset="utf-8" />
  <script src="https://sdpi-components.dev/releases/v4/sdpi-components.js"></script>
</head>
<body>
  <sdpi-item label="동작">
    <sdpi-select setting="mode">
      <option value="tab-prev">탭 ← (이전 탭)</option>
      <option value="tab-next">탭 → (다음 탭)</option>
      <option value="pane-prev">패널 ← (이전 패널)</option>
      <option value="pane-next">패널 → (다음 패널)</option>
      <option value="split-vertical">세로 분할</option>
      <option value="split-horizontal">가로 분할</option>
      <option value="new-tab">새 탭</option>
    </sdpi-select>
  </sdpi-item>
</body>
</html>
