<!DOCTYPE html>
<html>
<head lang="en">
  <title>Send to iTerm Settings</title>
  <meta charset="utf-8" />
  <script src="https://sdpi-components.dev/releases/v4/sdpi-components.js"></script>
</head>
<body>
  <sdpi-item label="모드">
    <sdpi-select setting="mode">
      <option value="text">텍스트 전송</option>
      <option value="ctrl-c">Ctrl+C (중단)</option>
    </sdpi-select>
  </sdpi-item>
  <sdpi-item label="텍스트">
    <sdpi-textfield setting="text" placeholder="/commit"></sdpi-textfield>
  </sdpi-item>
</body>
</html>
